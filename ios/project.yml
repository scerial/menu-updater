name: WeeklyMenu
options:
  bundleIdPrefix: com.menuupdater
  xcodeVersion: "27.1"
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
targets:
  WeeklyMenu:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menuupdater.weeklymenu
        DEVELOPMENT_TEAM: S9553U34PA
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
  WeeklyMenuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WeeklyMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menuupdater.weeklymenu.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0